aid: somos-internet
name: Somos Internet
description: 'Somos Internet is a Colombian residential and business fiber-optic internet
  service provider (ISP) delivering high-speed home and enterprise broadband across
  cities including Medellin, Bogota, Sabaneta, Rionegro, Caldas and Laureles. The
  company is building AI-ready digital infrastructure for Latin America and raised
  a $40M Series B backed by Ribbit Capital. It offers fiber internet plans, parental
  controls, TV channel line-ups, and Wi-Fi routers to homes, businesses, and property
  developers. No public developer API, SDK, MCP server, or other programmatic surface
  has been identified for Somos Internet; it is a consumer and enterprise connectivity
  provider rather than an API platform.'
